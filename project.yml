name: Beans

# 贰音 · 单线构建（iOS 15+，不含哔哩哔哩模块）
# 与 Sonicove 1.7.47 同构：2.0.3 功能集，但去掉哔哩哔哩模块（该模块依赖 iOS 16/17/26 API），
# 用 CiliCiliKit 替身（Modules/CiliCiliKitStub）保证 App 端桥接代码照常编译。
options:
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Beans:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Beans
        excludes:
          - "Folia/Views/FoliaStageView.swift"
          - "Folia/Views/FoliaClassicLayout.swift"
          - "Folia/Views/FoliaClassicRenderer.swift"
          - "Folia/Views/FoliaStillRenderer.swift"
          - "NowPlayingLiveActivity.swift"
          - "LockScreenArtwork.swift"
    resources:
      - Beans/en.lproj
      - Beans/zh-Hans.lproj
      - Beans/Resources/XProfile.html
      - Beans/Resources/CeruBilibili-LICENSE.txt
      - Beans/Resources/SimpleIcons-LICENSE.txt
      - Beans/Resources/CeruBilibili-NOTICE.md
      - Beans/Resources/linlan-music-source.js
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buer.music
        DEAD_CODE_STRIPPING: YES
        DEPLOYMENT_POSTPROCESSING: YES
        STRIP_INSTALLED_PRODUCT: YES
        SWIFT_COMPILATION_MODE: wholemodule
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        MARKETING_VERSION: "2.6.2"
        CURRENT_PROJECT_VERSION: "102"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Beans/Beans-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Beans/Beans.entitlements
    dependencies:
      - target: CiliCiliKit
        embed: false
    info:
      path: Beans/Info.plist
      properties:
        CFBundleDisplayName: 贰音
        LSRequiresIPhoneOS: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIImageName: LaunchBackground
          UIColorName: LaunchBackgroundColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CADisableMinimumFrameDurationOnPhone: true
        UISupportsCarPlay: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  # 哔哩哔哩模块的替身：只为让 App 端桥接代码编译通过，静态链接进主包（不产生嵌入框架）
  CiliCiliKit:
    type: framework
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Modules/CiliCiliKitStub/Sources/CiliCiliKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buer.music.cilicili
        MACH_O_TYPE: staticlib
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"

schemes:
  Beans:
    build:
      targets:
        Beans: all
    run:
      config: Debug
    archive:
      config: Release
